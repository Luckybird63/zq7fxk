version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: wind-backend
    ports:
      - "8000:8000"
    environment:
      - BMRS_API_KEY=${BMRS_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: wind-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    restart: unless-stopped
